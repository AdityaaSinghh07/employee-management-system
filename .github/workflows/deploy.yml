name: Deploy to EC2 (OIDC)

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::585853585762:role/GithubActionOIDC
          aws-region: us-east-1

      - name: Deploy via SSM
        run: |
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=instanceIds,Values=i-0b65904c2387ce6cf" \
            --parameters 'commands=[
              "cd /home/ubuntu/employee-management-system",
              "git pull origin main",

              "cd backend",
              "npm install",
              "pm2 restart ecosystem.config.js || pm2 start ecosystem.config.js",

              "cd ../frontend",
              "npm install",
              "npm run build",
              "sudo rm -rf /var/www/frontend/*",
              "sudo cp -r build/* /var/www/frontend/",

              "sudo systemctl restart nginx"
            ]'
