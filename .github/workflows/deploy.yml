name: Secure Employee Management System Deployment

on:
  push:
    branches:
      - main # Triggers when you push from your DevOps workstation to GitHub main branch

permissions:
  id-token: write # Mandatory for requesting the dynamic AWS OIDC JWT token
  contents: read  # Mandatory to checkout the codebase

jobs:
  # =============================================================
  # JOB 1: Parallel Frontend Dependency Scan & Vite Compile
  # =============================================================
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      # Scans frontend dependencies before execution
      - name: Security Scan Frontend Code (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: './frontend'
          format: 'table'
          exit-code: '1' # Breaks pipeline if matching vulnerabilities are discovered
          ignore-unfixed: true # Prevents breaking on bugs without a public patch
          severity: 'HIGH,CRITICAL'

      # Compiles into production static files only if scanning succeeds
      - name: Build Vite Production Bundles
        run: |
          cd frontend
          npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-assets
          path: frontend/dist/

  # =============================================================
  # JOB 2: Parallel Backend Dependency Scan & Staging
  # =============================================================
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      # Scans backend Node modules for CVEs
      - name: Security Scan Backend Code (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: './backend'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'

      # Upload the backend folder as an artifact
      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-assets
          path: backend/

  # =============================================================
  # JOB 3: Secure AWS Deployment via SSM
  # =============================================================
  deploy:
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Secure AWS OIDC Handshake
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1 # Match your target infrastructure region
          audience: sts.amazonaws.com

      # Download verified, compiled packages from parallel workers
      - name: Download Frontend Artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-assets
          path: ./dist-frontend

      - name: Download Backend Artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-assets
          path: ./dist-backend

      # SECURELY TRANSFER FILES TO EC2 OVER SSM (No S3, No Port 22!)
      - name: Transfer Frontend files via SSM
        uses: ncruces/actions-ssm-transfer@v1
        with:
          instance-id: ${{ secrets.EC2_INSTANCE_ID }}
          action: upload
          local-path: ./dist-frontend/
          remote-path: /var/www/html/

      - name: Transfer Backend files via SSM
        uses: ncruces/actions-ssm-transfer@v1
        with:
          instance-id: ${{ secrets.EC2_INSTANCE_ID }}
          action: upload
          local-path: ./dist-backend/
          remote-path: /var/www/backend/

      # Execute Configuration and Restart Steps
      - name: Execute Deployment Commands via AWS SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Configuring and restarting Employee System" \
            --parameters 'commands=[
              "set -e",
              
              "echo === Step 1: Inject Environment Configurations ===",
              "echo \"NODE_ENV=production\" | sudo tee /var/www/backend/.env",
              "echo \"DB_HOST=${{ secrets.RDS_ENDPOINT }}\" | sudo tee -a /var/www/backend/.env",
              "echo \"DB_USER=${{ secrets.DB_USER }}\" | sudo tee -a /var/www/backend/.env",
              "echo \"DB_PASS=${{ secrets.DB_PASSWORD }}\" | sudo tee -a /var/www/backend/.env",
              "echo \"JWT_SECRET=${{ secrets.JWT_SECRET }}\" | sudo tee -a /var/www/backend/.env",
              
              "echo === Step 2: Run Production Install ===",
              "cd /var/www/backend",
              "sudo npm install --production --unsafe-perm",
              
              "echo === Step 3: Zero-Downtime PM2 Ecosystem Reload ===",
              "sudo pm2 reload ecosystem.config.js --env production || sudo pm2 start ecosystem.config.js --env production",
              "sudo pm2 save"
            ]' \
            --query "Command.CommandId" \
            --output text)
          
          echo "SSM Execution sequence initialized. Tracking Command ID: $COMMAND_ID"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}"
