name: Secure Employee Management System Deployment

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  # =============================================================
  # JOB 1: Parallel Frontend Dependency Scan & Vite Compile
  # =============================================================
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Security Scan Frontend Code (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: './frontend'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'

      - name: Build Vite Production Bundles
        run: |
          cd frontend
          npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-assets
          path: frontend/dist/

  # =============================================================
  # JOB 2: Parallel Backend Dependency Scan & Staging
  # =============================================================
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Security Scan Backend Code (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: './backend'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'

      # Upload the backend folder as an artifact
      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-assets
          path: backend/

  # =============================================================
  # JOB 3: Secure AWS Deployment via SSM
  # =============================================================
  deploy:
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Secure AWS OIDC Handshake
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1
          audience: sts.amazonaws.com

      # Download built artifacts from previous stages
      - name: Download Frontend Artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-assets
          path: ./dist-frontend

      - name: Download Backend Artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-assets
          path: ./dist-backend

      # Package the builds into localized compressed bundles and encode them to text string format
      - name: Convert Build Bundles to Inline Text Strings
        id: encoder
        run: |
          tar -czf frontend.tar.gz -C ./dist-frontend .
          tar -czf backend.tar.gz -C ./dist-backend .
          
          # Convert archives to single-line base64 strings and save them to GitHub runner env profiles
          echo "FRONTEND_B64=$(base64 -w 0 frontend.tar.gz)" >> $GITHUB_ENV
          echo "BACKEND_B64=$(base64 -w 0 backend.tar.gz)" >> $GITHUB_ENV

      # Execute Extraction, Configuration, Environment Generation, and Restart Steps entirely over SSM
      - name: Execute Deployment Commands via AWS SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Unpacking builds and restarting PM2 apps via secure string injection" \
            --parameters 'commands=[
              "set -e",
              
              "echo === Step 1: Clean and Prepare Directory Paths ===",
              "sudo mkdir -p /var/www/html /var/www/backend",
              "sudo rm -rf /var/www/html/*",
              
              "echo === Step 2: Unpack Frontend Bundle From Payload ===",
              "echo \"${{ env.FRONTEND_B64 }}\" | base64 -d > /tmp/frontend.tar.gz",
              "sudo tar -xzf /tmp/frontend.tar.gz -C /var/www/html/",
              
              "echo === Step 3: Unpack Backend Bundle From Payload ===",
              "echo \"${{ env.BACKEND_B64 }}\" | base64 -d > /tmp/backend.tar.gz",
              "sudo tar -xzf /tmp/backend.tar.gz -C /var/www/backend/",
              
              "echo === Step 4: Inject Environment Configurations ===",
              "echo \"NODE_ENV=production\" | sudo tee /var/www/backend/.env",
              "echo \"DB_HOST=${{ secrets.RDS_ENDPOINT }}\" | sudo tee -a /var/www/backend/.env",
              "echo \"DB_USER=${{ secrets.DB_USER }}\" | sudo tee -a /var/www/backend/.env",
              "echo \"DB_PASS=${{ secrets.DB_PASSWORD }}\" | sudo tee -a /var/www/backend/.env",
              "echo \"JWT_SECRET=${{ secrets.JWT_SECRET }}\" | sudo tee -a /var/www/backend/.env",
              
              "echo === Step 5: Run Production Install ===",
              "cd /var/www/backend",
              "sudo npm install --production --unsafe-perm",
              
              "echo === Step 6: Zero-Downtime PM2 Ecosystem Reload ===",
              "sudo pm2 reload ecosystem.config.js --env production || sudo pm2 start ecosystem.config.js --env production",
              "sudo pm2 save",
              
              "echo === Step 7: Cleanup Temp Archives ===",
              "rm -f /tmp/frontend.tar.gz /tmp/backend.tar.gz"
            ]' \
            --query "Command.CommandId" \
            --output text)
          
          echo "SSM Execution sequence initialized. Tracking Command ID: $COMMAND_ID"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}"
