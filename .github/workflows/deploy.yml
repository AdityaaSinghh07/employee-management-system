name: Secure Employee Management System Deployment

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  id-token: write
  contents: read

jobs:
  # =============================================================
  # JOB 1: Parallel Frontend Dependency Scan & Vite Compile
  # =============================================================
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Security Scan Frontend Code (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: './frontend'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'

      - name: Build Vite Production Bundles
        run: |
          cd frontend
          npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-assets
          path: frontend/dist/

  # =============================================================
  # JOB 2: Parallel Backend Dependency Scan & Staging
  # =============================================================
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Security Scan Backend Code (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: './backend'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-assets
          path: backend/

  # =============================================================
  # JOB 3: Secure AWS Deployment via S3 Transit Bridge & SSM
  # =============================================================
  deploy:
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Secure AWS OIDC Handshake
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1
          audience: sts.amazonaws.com

      # Download built artifacts from previous stages
      - name: Download Frontend Artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-assets
          path: ./dist-frontend

      - name: Download Backend Artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-assets
          path: ./dist-backend

      # Package files into normal compressed archives
      - name: Package Code Bundles
        run: |
          tar -czf frontend.tar.gz -C ./dist-frontend .
          tar -czf backend.tar.gz -C ./dist-backend .

      # Uses GitHub variables to establish a globally unique lowercase bucket name
      - name: Sync Bundles to AWS S3
        run: |
          RAW_NAME="ems-deploy-transit-${{ github.repository_owner }}-${{ github.repository_id }}"
          BUCKET_NAME=$(echo "$RAW_NAME" | tr '[:upper:]' '[:lower:]')
          
          echo "TARGET_BUCKET=$BUCKET_NAME" >> $GITHUB_ENV
          
          if ! aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            echo "Creating secure deployment bucket: $BUCKET_NAME"
            aws s3api create-bucket --bucket "$BUCKET_NAME" --region us-east-1
            aws s3api put-bucket-encryption --bucket "$BUCKET_NAME" --server-side-encryption-configuration '{"Rules": [{"ApplyServerSideEncryptionByDefault": {"SSEAlgorithm": "AES256"}}]}'
          fi
          
          aws s3 cp frontend.tar.gz "s3://$BUCKET_NAME/frontend.tar.gz"
          aws s3 cp backend.tar.gz "s3://$BUCKET_NAME/backend.tar.gz"

      # Execute Extraction, Configuration, Environment Generation, and Restart Steps over SSM
      - name: Execute Deployment Commands via AWS SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Pulling deployment bundles from secure S3 transit and reloading PM2" \
            --parameters "commands=[
              \"set -e\",
              
              \"echo === Step 1: Clean and Prepare Directory Paths ===\",
              \"sudo mkdir -p /var/www/html /var/www/backend\",
              
              \"echo === Step 2: Download & Extract Frontend from S3 ===\",
              \"sudo rm -rf /var/www/html/*\",
              \"aws s3 cp s3://${{ env.TARGET_BUCKET }}/frontend.tar.gz /tmp/frontend.tar.gz\",
              \"sudo tar -xzf /tmp/frontend.tar.gz -C /var/www/html/\",
              
              \"echo === Step 3: Download & Extract Backend from S3 ===\",
              \"sudo rm -rf /var/www/backend/*\",
              \"aws s3 cp s3://${{ env.TARGET_BUCKET }}/backend.tar.gz /tmp/backend.tar.gz\",
              \"sudo tar -xzf /tmp/backend.tar.gz -C /var/www/backend/\",
              
              \"echo === Step 4: Inject Environment Configurations ===\",
              \"echo \\\"NODE_ENV=production\\\" | sudo tee /var/www/backend/.env\",
              \"echo \\\"DB_HOST=${{ secrets.RDS_ENDPOINT }}\\\" | sudo tee -a /var/www/backend/.env\",
              \"echo \\\"DB_USER=${{ secrets.DB_USER }}\\\" | sudo tee -a /var/www/backend/.env\",
              \"echo \\\"DB_PASS=${{ secrets.DB_PASSWORD }}\\\" | sudo tee -a /var/www/backend/.env\",
              \"echo \\\"JWT_SECRET=${{ secrets.JWT_SECRET }}\\\" | sudo tee -a /var/www/backend/.env\",
              
              \"echo === Step 5: Run Production Install ===\",
              \"cd /var/www/backend\",
              \"sudo npm install --production --unsafe-perm\",
              
              \"echo === Step 6: Zero-Downtime PM2 Ecosystem Reload ===\",
              \"export PATH=\$PATH:/usr/bin:/usr/local/bin:/home/ubuntu/.nvm/versions/node/v24.0.0/bin\",
              \"sudo env \\\"PATH=\$PATH\\\" pm2 reload ecosystem.config.js --env production || sudo env \\\"PATH=\$PATH\\\" pm2 start server.js --name ems-backend || true\",
              \"sudo env \\\"PATH=\$PATH\\\" pm2 save\",
              
              \"echo === Step 7: Cleanup Temp Archives ===\",
              \"rm -f /tmp/frontend.tar.gz /tmp/backend.tar.gz\"
            ]" \
            --query "Command.CommandId" \
            --output text)
          
          echo "SSM Execution sequence initialized. Tracking Command ID: $COMMAND_ID"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}"
